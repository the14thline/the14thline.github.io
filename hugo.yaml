baseURL: http://localhost:1314/
languageCode: en-us
title: the14thline
theme: PaperMod

enableRobotsTXT: true

paginate: 20

taxonomies:
  category: categories
  tag: tags

outputs:
  home:
    - HTML
    - RSS
    - JSON

params:
  defaultTheme: auto
  ShowReadingTime: true
  ShowCodeCopyButtons: true
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  disableScrollToTop: false
  hideAuthor: true

  # PaperMod's home list pulls from these content sections.
  mainSections:
    - posts

  homeInfoParams:
    Title: ""
    Content: |
      A sonnet consists of fourteen lines. The first thirteen are the build-up — a steady rhythm of logic, the heavy architecture of a premise, the "prose" of a life. In our modern existence, the first thirteen lines are our default. **But a sonnet is not a poem until it reaches the 14th line.**

      In literature, this is called the **Volta** — the "Turn." It is the moment the argument shifts, the perspective breaks, and the soul finally speaks. Without the 14th line, the previous thirteen are merely a list; with it, they become a symphony.

