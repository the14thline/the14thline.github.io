baseURL: https://the14thline.github.io/
languageCode: en-us
title: the14thline
theme: PaperMod

enableRobotsTXT: true

paginate: 20

taxonomies:
  category: categories
  tag: tags

outputs:
  home:
    - HTML
    - RSS
    - JSON

params:
  defaultTheme: auto
  ShowReadingTime: true
  ShowCodeCopyButtons: true
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  disableScrollToTop: false
  author: Jing

  # PaperMod's home list pulls from these content sections.
  mainSections:
    - posts

  homeInfoParams:
    Title: "Hi, I'm Jing."
    Content: "I write about tech (AI, software, systems), lifestyle (travel, reading), career (management, leadership), and thoughts."

  socialIcons:
    - name: twitter
      url: "https://example.com/twitter"
    - name: github
      url: "https://example.com/github"
    - name: instagram
      url: "https://example.com/instagram"
    - name: youtube
      url: "https://example.com/youtube"
    - name: rss
      url: "/index.xml"

menu:
  main:
    - name: Posts
      url: /posts/
      weight: 10
    - name: Archive
      url: /archives/
      weight: 20
    - name: Search
      url: /search/
      weight: 30
    - name: Tags
      url: /tags/
      weight: 40
    - name: Categories
      url: /categories/
      weight: 50
