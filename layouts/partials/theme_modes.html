<div class="theme-modes" aria-label="Theme modes">
  <button class="theme-modes__btn" type="button" data-mode="night" title="Night (N)">N</button>
  <button class="theme-modes__btn" type="button" data-mode="moonlight" title="Moonlight (M)">M</button>
  <button class="theme-modes__btn" type="button" data-mode="day" title="Day (D)">D</button>
  <button class="theme-modes__btn" type="button" data-mode="sunny" title="Sunny (S)">S</button>
  <button class="theme-modes__btn" type="button" data-mode="rainy" title="Rainy (R)">R</button>
  <button class="theme-modes__btn" type="button" data-mode="snowy" title="Snowy (W)">W</button>
</div>

<div class="theme-overlay theme-overlay--moonlight" aria-hidden="true"></div>
<div class="theme-overlay theme-overlay--sunny" aria-hidden="true"></div>
<div class="theme-overlay theme-overlay--rainy" aria-hidden="true"></div>
<div class="theme-overlay theme-overlay--snowy" aria-hidden="true"></div>
